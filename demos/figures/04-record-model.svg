<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <title>The record model</title>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="70" y="86" font-size="34" font-weight="600" fill="#24343f">Four archetypes, one temporal axis</text>
  <text x="70" y="122" font-size="20" fill="#7c8c9a">Every provider's records are one of these. That is the whole vocabulary — and why export is mechanical.</text>

  <!-- ── the four archetypes ───────────────────────────────────────── -->
  <g>
    <!-- Entity -->
    <rect x="70" y="164" width="340" height="292" rx="14" fill="#f7f9fb" stroke="#5b7c99" stroke-width="2.5"/>
    <text x="94" y="212" font-size="27" font-weight="700" fill="#24343f">Entity</text>
    <text x="94" y="246" font-size="18" fill="#3d4f5c">a thing with a lifetime</text>
    <text x="94" y="268" font-size="18" fill="#3d4f5c">— it opens, it closes</text>
    <line x1="94" y1="292" x2="386" y2="292" stroke="#e2e8ed" stroke-width="2"/>
    <g font-size="17" fill="#5f7183" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="94" y="326">mem_object</text>
      <text x="94" y="356">ib_qp</text>
      <text x="94" y="386">nccl_comm</text>
      <text x="94" y="416">ucx_endpoint</text>
    </g>
  </g>
  <g>
    <!-- Event -->
    <rect x="436" y="164" width="340" height="292" rx="14" fill="#f7f9fb" stroke="#5b7c99" stroke-width="2.5"/>
    <text x="460" y="212" font-size="27" font-weight="700" fill="#24343f">Event</text>
    <text x="460" y="246" font-size="18" fill="#3d4f5c">something that happened</text>
    <text x="460" y="268" font-size="18" fill="#3d4f5c">at, or over, a time</text>
    <line x1="460" y1="292" x2="752" y2="292" stroke="#e2e8ed" stroke-width="2"/>
    <g font-size="17" fill="#5f7183" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="460" y="326">gpu_access</text>
      <text x="460" y="356">ib_post_send</text>
      <text x="460" y="386">ib_poll_cq</text>
      <text x="460" y="416">nccl_collective</text>
    </g>
  </g>
  <g>
    <!-- Artifact -->
    <rect x="802" y="164" width="340" height="292" rx="14" fill="#f7f9fb" stroke="#5b7c99" stroke-width="2.5"/>
    <text x="826" y="212" font-size="27" font-weight="700" fill="#24343f">Artifact</text>
    <text x="826" y="246" font-size="18" fill="#3d4f5c">a one-off fact, recorded</text>
    <text x="826" y="268" font-size="18" fill="#3d4f5c">once, resolved later</text>
    <line x1="826" y1="292" x2="1118" y2="292" stroke="#e2e8ed" stroke-width="2"/>
    <g font-size="17" fill="#5f7183" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="826" y="326">source_line</text>
      <text x="826" y="356">intern_key</text>
      <text x="826" y="386">node_identity</text>
      <text x="826" y="416">clock_anchor</text>
    </g>
  </g>
  <g>
    <!-- Edge -->
    <rect x="1168" y="164" width="340" height="292" rx="14" fill="#f7f9fb" stroke="#5b7c99" stroke-width="2.5"/>
    <text x="1192" y="212" font-size="27" font-weight="700" fill="#24343f">Edge</text>
    <text x="1192" y="246" font-size="18" fill="#3d4f5c">a relation between</text>
    <text x="1192" y="268" font-size="18" fill="#3d4f5c">two handles</text>
    <line x1="1192" y1="292" x2="1484" y2="292" stroke="#e2e8ed" stroke-width="2"/>
    <g font-size="17" fill="#5f7183" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="1192" y="326">access → object</text>
      <text x="1192" y="356">pc → source line</text>
      <text x="1192" y="386">object → device</text>
      <text x="1192" y="416">endpoint → qp</text>
    </g>
  </g>

  <!-- ── temporal axis ─────────────────────────────────────────────── -->
  <text x="70" y="530" font-size="24" font-weight="600" fill="#24343f">…and each one carries a temporal kind</text>
  <text x="70" y="558" font-size="18" fill="#7c8c9a">so “when” is a property of the record, not a convention each provider reinvents</text>

  <g>
    <!-- Timeless -->
    <rect x="70" y="586" width="270" height="180" rx="12" fill="#fafbfc" stroke="#c9d2da" stroke-width="2"/>
    <text x="92" y="626" font-size="21" font-weight="600" fill="#24343f">Timeless</text>
    <text x="92" y="650" font-size="15" fill="#7c8c9a">no time at all</text>
    <line x1="92" y1="700" x2="318" y2="700" stroke="#e2e8ed" stroke-width="2"/>
    <text x="205" y="740" font-size="15" fill="#5f7183" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">source_line</text>
  </g>
  <g>
    <!-- Instant -->
    <rect x="360" y="586" width="270" height="180" rx="12" fill="#fafbfc" stroke="#c9d2da" stroke-width="2"/>
    <text x="382" y="626" font-size="21" font-weight="600" fill="#24343f">Instant</text>
    <text x="382" y="650" font-size="15" fill="#7c8c9a">one point</text>
    <line x1="382" y1="700" x2="608" y2="700" stroke="#e2e8ed" stroke-width="2"/>
    <circle cx="470" cy="700" r="8" fill="#5b7c99"/>
    <text x="495" y="740" font-size="15" fill="#5f7183" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">entity_close</text>
  </g>
  <g>
    <!-- Interval -->
    <rect x="650" y="586" width="270" height="180" rx="12" fill="#fafbfc" stroke="#c9d2da" stroke-width="2"/>
    <text x="672" y="626" font-size="21" font-weight="600" fill="#24343f">Interval</text>
    <text x="672" y="650" font-size="15" fill="#7c8c9a">start and end, both known</text>
    <line x1="672" y1="700" x2="898" y2="700" stroke="#e2e8ed" stroke-width="2"/>
    <rect x="712" y="692" width="140" height="16" rx="4" fill="#5b7c99"/>
    <line x1="712" y1="682" x2="712" y2="718" stroke="#3d4f5c" stroke-width="2.5"/>
    <line x1="852" y1="682" x2="852" y2="718" stroke="#3d4f5c" stroke-width="2.5"/>
    <text x="785" y="740" font-size="15" fill="#5f7183" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">ib_post_send</text>
  </g>
  <g>
    <!-- Window -->
    <rect x="940" y="586" width="270" height="180" rx="12" fill="#fafbfc" stroke="#c9d2da" stroke-width="2"/>
    <text x="962" y="626" font-size="21" font-weight="600" fill="#24343f">Window</text>
    <text x="962" y="650" font-size="15" fill="#7c8c9a">somewhere in this range</text>
    <line x1="962" y1="700" x2="1188" y2="700" stroke="#e2e8ed" stroke-width="2"/>
    <rect x="1002" y="692" width="140" height="16" rx="4" fill="#5b7c99" opacity="0.35"/>
    <line x1="1002" y1="684" x2="1002" y2="716" stroke="#5b7c99" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="1142" y1="684" x2="1142" y2="716" stroke="#5b7c99" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="1075" y="740" font-size="15" fill="#5f7183" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">gpu_access</text>
  </g>
  <g>
    <!-- Counter -->
    <rect x="1230" y="586" width="270" height="180" rx="12" fill="#fafbfc" stroke="#c9d2da" stroke-width="2"/>
    <text x="1252" y="626" font-size="21" font-weight="600" fill="#24343f">Counter</text>
    <text x="1252" y="650" font-size="15" fill="#7c8c9a">a value, sampled</text>
    <line x1="1252" y1="712" x2="1478" y2="712" stroke="#e2e8ed" stroke-width="2"/>
    <g fill="#5b7c99">
      <circle cx="1292" cy="700" r="6"/><circle cx="1332" cy="682" r="6"/>
      <circle cx="1372" cy="692" r="6"/><circle cx="1412" cy="668" r="6"/>
    </g>
    <polyline points="1292,700 1332,682 1372,692 1412,668" fill="none" stroke="#5b7c99" stroke-width="2" opacity="0.5"/>
    <text x="1365" y="748" font-size="15" fill="#5f7183" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">(no producer yet)</text>
  </g>

  <text x="70" y="836" font-size="25" fill="#24343f"><tspan font-weight="600">Because there are only four shapes, the reader is written once.</tspan><tspan fill="#7c8c9a"> A new provider gets tables, SQL, timeline and UI for free.</tspan></text>
</svg>
