<svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" width="1496" height="748" font-family="Inter, Helvetica Neue, Arial, sans-serif"><title>The mlx5dv DEVX provider's nine record types: the umem and UAR handed to the NIC, the DEVX queue pair, the doorbell and device send that follow, and the send-queue watcher's coverage</title><desc>Hand-authored layout, emitted by tools/gen_figures.py. The record set was cross-checked against the PCOMM_RECORD declarations by hand; nothing enforces it.</desc><rect width="880.0" height="440.0" fill="#ffffff" /><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8298a8" /></marker></defs><g><rect x="10" y="40" width="230" height="46" rx="3" fill="#ffffff" stroke="#6a5aa0" stroke-width="1.4" /><rect x="10" y="40" width="3.5" height="46" rx="1.5" fill="#6a5aa0" /><text x="23" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">mlx5_umem</text><text x="23" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">umem · umem_id · range · fd</text><text x="228" y="60" fill="#6a5aa0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">200</text><text x="228" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="10" y="130" width="230" height="46" rx="3" fill="#ffffff" stroke="#6a5aa0" stroke-width="1.4" /><rect x="10" y="130" width="3.5" height="46" rx="1.5" fill="#6a5aa0" /><text x="23" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">mlx5_uar</text><text x="23" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">uar · reg_addr · page_id</text><text x="228" y="150" fill="#6a5aa0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">202</text><text x="228" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="320" y="40" width="230" height="46" rx="3" fill="#ffffff" stroke="#6a5aa0" stroke-width="1.4" /><rect x="320" y="40" width="3.5" height="46" rx="1.5" fill="#6a5aa0" /><text x="333" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">mlx5_devx_qp</text><text x="333" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">obj · qp_num · wq_umem_id</text><text x="538" y="60" fill="#6a5aa0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">206</text><text x="538" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="320" y="130" width="230" height="46" rx="3" fill="#ffffff" stroke="#6a5aa0" stroke-width="1.4" /><rect x="320" y="130" width="3.5" height="46" rx="1.5" fill="#6a5aa0" /><text x="333" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">mlx5_devx_cmd</text><text x="333" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">obj · opcode · decoded</text><text x="538" y="150" fill="#6a5aa0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">204</text><text x="538" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="320" y="220" width="230" height="46" rx="3" fill="#ffffff" stroke="#6a5aa0" stroke-width="1.4" /><rect x="320" y="220" width="3.5" height="46" rx="1.5" fill="#6a5aa0" /><text x="333" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">mlx5_doorbell</text><text x="333" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">uar · qp_num · prod_idx</text><text x="538" y="240" fill="#6a5aa0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">212</text><text x="538" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="630" y="40" width="230" height="46" rx="3" fill="#ffffff" stroke="#6a5aa0" stroke-width="1.4" /><rect x="630" y="40" width="3.5" height="46" rx="1.5" fill="#6a5aa0" /><text x="643" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">mlx5_devx_qp_connect</text><text x="643" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">src_lid|gid → dest_lid|gid</text><text x="848" y="60" fill="#6a5aa0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">208</text><text x="848" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="630" y="130" width="230" height="46" rx="3" fill="#ffffff" stroke="#6a5aa0" stroke-width="1.4" /><rect x="630" y="130" width="3.5" height="46" rx="1.5" fill="#6a5aa0" /><text x="643" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">mlx5_device_send</text><text x="643" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">qp_num · wqe_idx · laddr/raddr</text><text x="848" y="150" fill="#6a5aa0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">214</text><text x="848" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="630" y="220" width="230" height="46" rx="3" fill="#ffffff" stroke="#6a5aa0" stroke-width="1.4" /><rect x="630" y="220" width="3.5" height="46" rx="1.5" fill="#6a5aa0" /><text x="643" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">mlx5_devx_cq</text><text x="643" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">obj · cqn · cq_base</text><text x="848" y="240" fill="#6a5aa0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">216</text><text x="848" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="630" y="310" width="230" height="46" rx="3" fill="#ffffff" stroke="#6a5aa0" stroke-width="1.4" /><rect x="630" y="310" width="3.5" height="46" rx="1.5" fill="#6a5aa0" /><text x="643" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">mlx5_send_coverage</text><text x="643" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">published · decoded · lapped</text><text x="848" y="330" fill="#6a5aa0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">218</text><text x="848" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ART</text></g><g><rect x="10" y="250" width="230" height="46" rx="3" fill="#ffffff" stroke="#6a5aa0" stroke-width="1.4" /><rect x="10" y="250" width="3.5" height="46" rx="1.5" fill="#6a5aa0" /><text x="23" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">mlx5_queue_pair</text><text x="23" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">qp · pd · qp_num</text><text x="228" y="270" fill="#6a5aa0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">210</text><text x="228" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><path d="M630 243 H565 V63 H435" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="560" y="150" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">cqn_snd → cqn</text><path d="M320 63 H245" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="282" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">wq_umem_id → umem_id</text><path d="M435 130 V86" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="443" y="116" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">obj</text><path d="M320 243 H280 V153 H245" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="276" y="205" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">uar</text><path d="M630 63 H578" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M630 153 H578" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M578 63 V153" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M578 63 H555" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="578" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">qp_num</text><text x="10" y="372" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">mlx5_send_coverage is the send-queue watcher's own count, one row per rank: published = decoded + lapped + dropped.</text><text x="10" y="390" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">The doorbell is what announces the WQE that mlx5_device_send decodes — so a row in one without the other is a</text><text x="10" y="406" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">readable state, not a contradiction: the doorbell is emitted even when the work-queue entry cannot be read, so an</text><text x="10" y="422" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">undecodable doorbell stays a visible row instead of vanishing.</text><text x="255" y="282" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">Not DEVX at all: an ordinary verbs queue pair reached through the mlx5 door.</text><text x="255" y="298" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">perftest creates its queue pairs this way and never calls ibv_create_qp.</text></svg>
