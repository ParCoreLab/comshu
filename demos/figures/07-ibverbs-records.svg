, monospace" font-size="9.5" fill="#5f7183">cq</text><path d="M620 273 H566" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M620 343 H566" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M566 223 V343" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M566 223 H535" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="562" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">qp</text><path d="M620 483 H552 V293 H535" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="548" y="500" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">subject, per origin</text><path d="M415 160 V196" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="423" y="176" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">qp</text><path d="M620 413 H590 V363 H535" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="562" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">lkey → mr</text><path d="M735 390 V366" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="743" y="381" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">(qp_num, wr_id, ticks)</text><text x="10" y="236" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">ib_device and ib_port exist so a rank</text><text x="10" y="250" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">that never moves traffic still has a LID.</text><text x="10" y="278" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a"