 font-size="11" font-weight="500" text-anchor="end">602</text><text x="518" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="620" y="40" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="620" y="40" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="633" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_endpoint</text><text x="633" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">endpoint · worker</text><text x="838" y="60" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">604</text><text x="838" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="10" y="145" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="10" y="145" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="23" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_mem_map</text><text x="23" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">memh · context · address</text><text x="228" y="165" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">614</text><text x="228" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="300" y="145" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="300" y="145" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="313" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_worker_address</text><text x="313" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">worker · prefix_hash</text><text x="518" y="165" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">622</text><text x="518" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ART</text></g><g><rect x="300" y="215" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="300" y="215" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="313" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_tag_recv</text><text x="313" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">worker · tag · tag_mask</text><text x="518" y="235" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">608</text><text x="518" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="300" y="285" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="300" y="285" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="313" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_tag_probe</text><text x="313" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">worker · message · length</text><text x="518" y="305" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">618</text><text x="518" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="300" y="355" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="300" y="355" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="313" y="375" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_worker_progress</text><text x="313" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">worker · progressed</text><text x="518" y="375" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">616</text><text x="518" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="620" y="145" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="620" y="145" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="633" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_ep_connection</text><text x="633" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">endpoint · remote_prefix_hash</text><text x="838" y="165" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">624</text><text x="838" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ART</text></g><g><rect x="620" y="215" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="620" y="215" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="633" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_tag_send</text><text x="633" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">endpoint · tag · buffer</text><text x="838" y="235" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">606</text><text x="838" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="620" y="285" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="620" y="285" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="633" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_rma</text><text x="633" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">endpoint · op · remote_addr</text><text x="838" y="305" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">610</text><text x="838" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="620" y="355" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="620" y="355" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="633" y="375" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_atomic</text><text x="633" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">endpoint · op · remote_addr</text><text x="838" y="375" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">620</text><text x="838" y="391" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="620" y="425" width="230" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="620" y="425" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="633" y="445" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_am_send</text><text x="633" y="461" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">endpoint · am_id · header_len</text><text x="838" y="445" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">612</text><text x="838" y="461" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><path d="M300 63 H245" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="272" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">context</text><path d="M620 63 H555" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="587" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">worker</text><path d="M125 145 V90" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="133" y="122" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">context</text><path d="M300 168 H268" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M300 238 H268" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M300 308 H268" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M300 378 H268" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M268 102 V378" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M268 102 H415" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M415 102 V90" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="262" y="240.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">worker</text><path d="M620 168 H588" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M620 238 H588" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M620 308 H588" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M620 378 H588" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M620 448 H588" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M588 102 V448" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M588 102 H735" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M735 102 V90" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="582" y="275.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">endpoint</text><path d="M415 285 V261" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="423" y="276" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">message</text><text x="10" y="215" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">The spine is ownership: a context owns</text><text x="10" y="229" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">workers, a worker owns endpoints.</text><text x="10" y="257" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">Which side a call hangs off is the API's own</text><text x="10" y="271" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">shape, not a convention. A tagged send names</text><text x="10" y="285" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">its endpoint; a tagged receive cannot, because</text><text x="10" y="299" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">it matches by tag across every peer at once.</text><text x="10" y="327" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">ucx_tag_probe carries the one true byte count</text><text x="10" y="341" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">in this family. Every other count is capacity</text><text x="10" y="355" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">offered, not bytes delivered.</text><text x="10" y="383" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">ucx_worker_address and ucx_ep_connection</text><text x="10" y="397" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">exist only to make the cross-rank join</text><text x="10" y="411" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">possible at all.</text></svg>
