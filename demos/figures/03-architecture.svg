<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <title>comshu architecture</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f7183"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="70" y="88" font-size="34" font-weight="600" fill="#24343f">One capture path, however many transports</text>
  <text x="70" y="124" font-size="20" fill="#7c8c9a">Vendor types live only in providers. Everything downstream speaks one record model.</text>

  <!-- ── app ───────────────────────────────────────────────────────── -->
  <rect x="60" y="330" width="190" height="130" rx="14" fill="#f5f7f9" stroke="#c9d2da" stroke-width="2"/>
  <text x="155" y="382" font-size="22" font-weight="600" fill="#24343f" text-anchor="middle">your app</text>
  <text x="155" y="410" font-size="16" fill="#7c8c9a" text-anchor="middle">unmodified,</text>
  <text x="155" y="430" font-size="16" fill="#7c8c9a" text-anchor="middle">unrecompiled</text>
  <line x1="250" y1="395" x2="296" y2="395" stroke="#5f7183" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- ── providers ─────────────────────────────────────────────────── -->
  <text x="300" y="186" font-size="18" font-weight="600" fill="#5f7183">PROVIDERS — one .so each</text>
  <g font-size="20" font-weight="600">
    <g>
      <rect x="300" y="200" width="340" height="62" rx="10" fill="#f7ded2" stroke="#b4552d" stroke-width="2"/>
      <text x="318" y="228" fill="#24343f">ib</text>
      <text x="318" y="250" font-size="15" font-weight="400" fill="#8a3f1f">LD_PRELOAD over libibverbs</text>
    </g>
    <g>
      <rect x="300" y="272" width="340" height="62" rx="10" fill="#f7ded2" stroke="#b4552d" stroke-width="2"/>
      <text x="318" y="300" fill="#24343f">ibgda</text>
      <text x="318" y="322" font-size="15" font-weight="400" fill="#8a3f1f">DEVX / mlx5dv — the GPU rings the doorbell</text>
    </g>
    <g>
      <rect x="300" y="344" width="340" height="62" rx="10" fill="#d8e6da" stroke="#2f7d5d" stroke-width="2"/>
      <text x="318" y="372" fill="#24343f">gpumem</text>
      <text x="318" y="394" font-size="15" font-weight="400" fill="#245f47">NVBit instrumentation of SASS load/store</text>
    </g>
    <g>
      <rect x="300" y="416" width="340" height="62" rx="10" fill="#f2eefa" stroke="#7a5fa8" stroke-width="2"/>
      <text x="318" y="444" fill="#24343f">nccl</text>
      <text x="318" y="466" font-size="15" font-weight="400" fill="#4c3a72">NCCL's own profiler plugin interface</text>
    </g>
    <g>
      <rect x="300" y="488" width="340" height="62" rx="10" fill="#ede0ee" stroke="#7a5fa8" stroke-width="2"/>
      <text x="318" y="516" fill="#24343f">ucx</text>
      <text x="318" y="538" font-size="15" font-weight="400" fill="#4c3a72">UCX transport hooks</text>
    </g>
  </g>
  <text x="300" y="590" font-size="16" fill="#b4552d">all of them <tspan font-weight="600">co-run</tspan> in one process — one recorder, one clock, one timeline</text>
  <text x="300" y="614" font-size="16" fill="#7c8c9a">a provider that must own the runtime gets its own replay pass instead</text>

  <g stroke="#5f7183" stroke-width="2.5" marker-end="url(#ar)" fill="none">
    <path d="M640 231 C 670 231, 670 340, 700 340"/>
    <path d="M640 303 C 670 303, 670 360, 700 360"/>
    <path d="M640 375 L 700 375"/>
    <path d="M640 447 C 670 447, 670 392, 700 392"/>
    <path d="M640 519 C 670 519, 670 412, 700 412"/>
  </g>

  <!-- ── recorder ──────────────────────────────────────────────────── -->
  <rect x="704" y="200" width="230" height="350" rx="14" fill="#f7f9fb" stroke="#5b7c99" stroke-width="2.5"/>
  <text x="819" y="248" font-size="24" font-weight="700" fill="#24343f" text-anchor="middle">Recorder</text>
  <g font-size="17" fill="#3d4f5c" text-anchor="middle">
    <text x="819" y="298">thread-local buffers</text>
    <text x="819" y="336">intern table</text>
    <text x="819" y="374">one clock domain</text>
    <text x="819" y="412">one record model</text>
  </g>
  <text x="819" y="468" font-size="15" fill="#7c8c9a" text-anchor="middle">Entity · Event</text>
  <text x="819" y="490" font-size="15" fill="#7c8c9a" text-anchor="middle">Artifact · Edge</text>
  <text x="819" y="524" font-size="15" fill="#b4552d" text-anchor="middle" font-style="italic">no cuda* / ibv_* here</text>

  <line x1="934" y1="375" x2="980" y2="375" stroke="#5f7183" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- ── streams ───────────────────────────────────────────────────── -->
  <rect x="984" y="200" width="230" height="350" rx="14" fill="#f5f7f9" stroke="#c9d2da" stroke-width="2"/>
  <text x="1099" y="248" font-size="22" font-weight="700" fill="#24343f" text-anchor="middle">.pcs streams</text>
  <text x="1099" y="274" font-size="15" fill="#7c8c9a" text-anchor="middle">one file per record type</text>
  <g font-size="13" fill="#3d4f5c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="1000" y="316">rank-0/</text>
    <text x="1012" y="342">110.pcs  ib_post_send</text>
    <text x="1012" y="366">700.pcs  gpu_access</text>
    <text x="1012" y="390">902.pcs  nccl_collective</text>
    <text x="1012" y="414">520.pcs  mem_object</text>
    <text x="1000" y="440">rank-1/ …</text>
  </g>
  <text x="1099" y="494" font-size="15" fill="#7c8c9a" text-anchor="middle">each stream's header names</text>
  <text x="1099" y="514" font-size="15" fill="#7c8c9a" text-anchor="middle">its own type and schema</text>

  <g stroke="#5f7183" stroke-width="2.5" marker-end="url(#ar)" fill="none">
    <path d="M1214 375 C 1244 375, 1244 235, 1274 235"/>
    <path d="M1214 375 C 1244 375, 1244 325, 1274 325"/>
    <path d="M1214 375 C 1244 375, 1244 415, 1274 415"/>
    <path d="M1214 375 C 1244 375, 1244 505, 1274 505"/>
  </g>

  <!-- ── readers ───────────────────────────────────────────────────── -->
  <text x="1278" y="186" font-size="18" font-weight="600" fill="#5f7183">comshu read / export / ui</text>
  <g>
    <rect x="1278" y="204" width="256" height="62" rx="10" fill="#f7f9fb" stroke="#5b7c99" stroke-width="2"/>
    <text x="1296" y="232" font-size="20" font-weight="600" fill="#24343f">CSV / Parquet</text>
    <text x="1296" y="254" font-size="15" fill="#7c8c9a">→ SQL, anywhere</text>

    <rect x="1278" y="294" width="256" height="62" rx="10" fill="#f7f9fb" stroke="#5b7c99" stroke-width="2"/>
    <text x="1296" y="322" font-size="20" font-weight="600" fill="#24343f">Perfetto trace</text>
    <text x="1296" y="344" font-size="15" fill="#7c8c9a">cross-node clocks aligned</text>

    <rect x="1278" y="384" width="256" height="62" rx="10" fill="#f7f9fb" stroke="#5b7c99" stroke-width="2"/>
    <text x="1296" y="412" font-size="20" font-weight="600" fill="#24343f">comshu ui</text>
    <text x="1296" y="434" font-size="15" fill="#7c8c9a">matrix · graph · sankey · timeline</text>

    <rect x="1278" y="474" width="256" height="62" rx="10" fill="#f2eefa" stroke="#7a5fa8" stroke-width="2"/>
    <text x="1296" y="502" font-size="20" font-weight="600" fill="#24343f">Ask / Chat</text>
    <text x="1296" y="524" font-size="15" fill="#4c3a72">English in, SQL + chart out</text>
  </g>

  <!-- ── layer band ────────────────────────────────────────────────── -->
  <line x1="60" y1="676" x2="1540" y2="676" stroke="#e2e8ed" stroke-width="2"/>
  <g font-size="17">
    <rect x="300" y="694" width="340" height="34" rx="8" fill="#fdf1ea" stroke="#b4552d" stroke-width="1.5"/>
    <text x="470" y="717" fill="#8a3f1f" text-anchor="middle" font-weight="600">L3 — vendor SDKs allowed</text>

    <rect x="704" y="694" width="830" height="34" rx="8" fill="#f7f9fb" stroke="#5b7c99" stroke-width="1.5"/>
    <text x="1119" y="717" fill="#3d4f5c" text-anchor="middle" font-weight="600">L0–L2 — vendor-free: no cuda*, hip*, ibv_*, Sanitizer_* types allowed, enforced at build</text>
  </g>

  <text x="70" y="822" font-size="25" fill="#24343f"><tspan font-weight="600">Adding a transport is adding a provider.</tspan><tspan fill="#7c8c9a"> Nothing to the right of the recorder has to learn about it.</tspan></text>
</svg>
