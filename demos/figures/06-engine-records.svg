ono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">node_identity</text><text x="23" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">node_hash</text><text x="228" y="250" fill="#5b7c99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">524</text><text x="228" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="300" y="230" width="230" height="46" rx="3" fill="#ffffff" stroke="#5b7c99" stroke-width="1.4" /><rect x="300" y="230" width="3.5" height="46" rx="1.5" fill="#5b7c99" /><text x="313" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">entity_close</text><text x="313" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">subject · opener</text><text x="518" y="250" fill="#5b7c99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">522</text><text x="518" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="590" y="230" width="230" height="46" rx="3" fill="#ffffff" stroke="#5b7c99" stroke-width="1.4" /><rect x="590" y="230" width="3.5" height="46" rx="1.5" fill="#5b7c99" /><text x="603" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">clock_anchor</text><text x="603" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">domain · local_ticks · wall_ns</text><text x="808" y="250" fill="#5b7c99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">590</text><text x="808" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ART</text></g><g><rect x="150" y="336" width="230" height="46" rx="3" fill="#ffffff" stroke="#5b7c99" stroke-width="1.4" /><rect x="150" y="336" width="3.5" height="46" rx="1.5" fill="#5b7c99" /><text x="163" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">intern_key</text><text x="163" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">key → handle · domain</text><text x="368" y="356" fill="#5b7c99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">510</text><text x="368" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ART</text></g><g><rect x="450" y="336" width="230" height="46" rx="3" fill="#ffffff" stroke="#5b7c99" stroke-width="1.4" /><rect x="450" y="336" width="3.5" height="46" rx="1.5" fill="#5b7c99" /><text x="463" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">intern_string</text><text x="463" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">offset · length → blob</text><text x="668" y="356" fill="#5b7c99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">512</text><text x="668" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ART</text></g><path d="M300 63 H245" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="272" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">object → id</text><path d="M530 63 H585" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="558" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">launch → correlation</text><path d="M415 86 V140" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="423" y="116" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">pc</text><path d="M125 145 V90" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="133" y="122" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">peer addr → owner base</text><path d="M415 276 V300" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><path d="M125 276 V300" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><path d="M705 276 V300" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="10" y="424" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">entity_close is one shared type for every provider: subject is the interned handle the OPEN record carried,</text><text x="10" y="438" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">and opener is that record's type_id. A close naming a subject nothing opened is not a bug in the close hook —</text><text x="10" y="452" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">it is evidence of a creation door that is not hooked, and it is counted rather than suppressed.</text></svg>
