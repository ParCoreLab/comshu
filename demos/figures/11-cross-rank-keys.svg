0" y="326" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="33" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_worker_address</text><text x="33" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">prefix_hash P</text><text x="234" y="346" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">622</text><text x="234" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end" /></g><g><rect x="614" y="326" width="226" height="46" rx="3" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4" /><rect x="614" y="326" width="3.5" height="46" rx="1.5" fill="#1f7a70" /><text x="627" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">ucx_worker_address</text><text x="627" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">ep dialled at prefix P</text><text x="828" y="346" fill="#1f7a70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">622</text><text x="828" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end" /></g><path d="M246 349 H610" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><path d="M610 349 H246" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><rect x="282" y="323" width="296" height="23" rx="3" fill="#ffffff" /><text x="430" y="339" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#24343f">prefix_hash</text><text x="430" y="366" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">the dialled worker, found in the other rank's capture</text><g><rect x="20" y="416" width="226" height="46" rx="3" fill="#ffffff" stroke="#5b7c99" stroke-width="1.4" /><rect x="20" y="416" width="3.5" height="46" rx="1.5" fill="#5b7c99" /><text x="33" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">peer_mapping</text><text x="33" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">allocation F · exporter 1</text><text x="234" y="436" fill="#5b7c99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">526</text><text x="234" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end" /></g><g><rect x="614" y="416" width="226" height="46" rx="3" fill="#ffffff" stroke="#5b7c99" stroke-width="1.4" /><rect x="614" y="416" width="3.5" height="46" rx="1.5" fill="#5b7c99" /><text x="627" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">peer_mapping</text><text x="627" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">allocation F · exporter 0</text><text x="828" y="436" fill="#5b7c99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">526</text><text x="828" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end" /></g><path d="M246 439 H610" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><path d="M610 439 H246" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><rect x="282" y="413" width="296" height="23" rx="3" fill="#ffffff" /><text x="430" y="429" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#24343f">allocation (fabric handle)</text><text x="430" y="456" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">both sides mint the same id from the same 64 bytes</text><text x="8" y="522" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">A capture is N independent per-rank directories written by N processes that never coordinate. These five keys are the whole of</text><text x="8" y="538" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">what makes them one picture — every other field in the record model is rank-local.</text></svg>
