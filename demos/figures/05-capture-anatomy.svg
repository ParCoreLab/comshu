<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 528" xmlns="http://www.w3.org/2000/svg" width="1496" height="898" font-family="Inter, Helvetica Neue, Arial, sans-serif"><title>A capture is one directory per rank of packed record streams; each stream is a 32-byte header followed by fixed-stride records whose high-cardinality fields are handles into the capture's own intern dictionary</title><desc>Hand-authored layout, emitted by tools/gen_figures.py. The record set was cross-checked against the PCOMM_RECORD declarations by hand; nothing enforces it.</desc><rect width="880.0" height="528.0" fill="#ffffff" /><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8298a8" /></marker></defs><rect x="10" y="56" width="150" height="44" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="85.0" y="76.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">pcomm-out/</text><text x="85.0" y="91.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">the capture</text><rect x="210" y="12" width="140" height="44" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="280.0" y="38.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">rank-0/</text><path d="M160 78 H185 V34 H206" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><rect x="210" y="68" width="140" height="44" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="280.0" y="94.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">rank-1/</text><path d="M160 78 H185 V90 H206" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><rect x="210" y="124" width="140" height="44" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="280.0" y="150.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">rank-2/  …  rank-15/</text><path d="M160 78 H185 V146 H206" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><rect x="410" y="4" width="200" height="32" rx="3" fill="#ffffff" stroke="#e2e8ed" stroke-width="1.2" /><text x="510.0" y="24.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">100.pcs</text><text x="620" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">ib_mem_region</text><path d="M350 34 H380 V20 H406" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><rect x="410" y="42" width="200" height="32" rx="3" fill="#ffffff" stroke="#e2e8ed" stroke-width="1.2" /><text x="510.0" y="62.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">110.pcs</text><text x="620" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">ib_post_send</text><path d="M350 34 H380 V58 H406" fill="none" stroke="#8298a8" stroke-width="1.2" /><rect x="410" y="80" width="200" height="32" rx="3" fill="#ffffff" stroke="#e2e8ed" stroke-width="1.2" /><text x="510.0" y="100.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">520.pcs</text><text x="620" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">mem_object</text><path d="M350 34 H380 V96 H406" fill="none" stroke="#8298a8" stroke-width="1.2" /><rect x="410" y="118" width="200" height="32" rx="3" fill="#ffffff" stroke="#e2e8ed" stroke-width="1.2" /><text x="510.0" y="138.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">700.pcs</text><text x="620" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">gpu_access</text><path d="M350 34 H380 V134 H406" fill="none" stroke="#8298a8" stroke-width="1.2" /><rect x="410" y="156" width="200" height="32" rx="3" fill="#ffffff" stroke="#e2e8ed" stroke-width="1.2" /><text x="510.0" y="176.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">intern-blob.bin</text><text x="620" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">the byte heap</text><path d="M350 34 H380 V172 H406" fill="none" stroke="#8298a8" stroke-width="1.2" /><text x="410" y="206" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">one file per record type — the header inside</text><text x="410" y="220" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">names it, so a filename is never load-bearing</text><text x="10" y="122" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">N independent per-rank</text><text x="10" y="136" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">directories. Nothing in a</text><text x="10" y="150" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">capture is written twice.</text><text x="10" y="258" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="1.2" fill="#95a4b0">INSIDE ONE .PCS</text><rect x="10" y="270" width="130" height="40" rx="3" fill="#f2f6f9" stroke="#5b7c99" stroke-width="1.2" /><text x="75.0" y="288.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">StreamHeader</text><text x="75.0" y="303.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">32 B, once</text><rect x="146" y="270" width="118" height="40" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="205.0" y="294.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">record 0</text><rect x="268" y="270" width="118" height="40" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="327.0" y="294.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">record 1</text><rect x="390" y="270" width="118" height="40" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="449.0" y="294.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">record 2</text><rect x="512" y="270" width="118" height="40" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="571.0" y="294.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">record 3</text><rect x="634" y="270" width="118" height="40" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="693.0" y="294.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">record 4</text><rect x="756" y="270" width="118" height="40" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="815.0" y="294.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">…</text><text x="10" y="328" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">magic · format_version · type_id · stride · schema_hash · kind</text><text x="874" y="328" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">a packed array — fixed stride, no framing, the writer is a memcpy</text><text x="10" y="380" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" letter-spacing="1.2" fill="#95a4b0">INSIDE ONE RECORD — GPU_ACCESS, TYPE 700</text><rect x="10" y="392" width="150" height="44" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="85.0" y="412.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">Temporal</text><text x="85.0" y="427.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">48 B · kind, a, b</text><rect x="162" y="392" width="90" height="44" rx="3" fill="#f3f8f1" stroke="#4f7d3f" stroke-width="1.2" /><text x="207.0" y="412.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">pc</text><text x="207.0" y="427.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">Handle</text><rect x="254" y="392" width="90" height="44" rx="3" fill="#f3f8f1" stroke="#4f7d3f" stroke-width="1.2" /><text x="299.0" y="412.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">object</text><text x="299.0" y="427.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">Handle</text><rect x="346" y="392" width="110" height="44" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="401.0" y="412.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">address</text><text x="401.0" y="427.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">u64</text><rect x="458" y="392" width="110" height="44" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="513.0" y="412.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">launch</text><text x="513.0" y="427.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">u64</text><rect x="570" y="392" width="280" height="44" rx="3" fill="#ffffff" stroke="#a8b6c2" stroke-width="1.2" /><text x="710.0" y="412.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">size · op · space · device · thread</text><text x="710.0" y="427.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">fixed width</text><path d="M207.0 436 V466" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><path d="M299.0 436 V466" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><rect x="120" y="468" width="390" height="38" rx="3" fill="#f2f6f9" stroke="#5b7c99" stroke-width="1.2" /><text x="315.0" y="491.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#24343f">intern_key 510  ·  intern_string 512</text><text x="530" y="478" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">+ intern-blob.bin, behind its own header. Lookups are</text><text x="530" y="492" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">keyed by (domain, handle): handle 1 in Pc and handle 1</text><text x="530" y="506" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">in KernelName are different things.</text></svg>
