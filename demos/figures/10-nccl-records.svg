<svg viewBox="0 0 1060 400" xmlns="http://www.w3.org/2000/svg" width="1802" height="680" font-family="Inter, Helvetica Neue, Arial, sans-serif"><title>The NCCL provider's nine record types: six host-API records hanging off the communicator, and three profiler-plugin records carrying what NCCL chose</title><desc>Hand-authored layout, emitted by tools/gen_figures.py. The record set was cross-checked against the PCOMM_RECORD declarations by hand; nothing enforces it.</desc><rect width="1060.0" height="400.0" fill="#ffffff" /><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8298a8" /></marker></defs><g><rect x="10" y="130" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="10" y="130" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="23" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_comm</text><text x="23" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">comm · comm_hash · rank</text><text x="228" y="150" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">900</text><text x="228" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="360" y="40" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="360" y="40" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="373" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_collective</text><text x="373" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">comm · count · root · op</text><text x="578" y="60" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">902</text><text x="578" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="360" y="110" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="360" y="110" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="373" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_p2p</text><text x="373" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">comm · peer · dir · count</text><text x="578" y="130" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">904</text><text x="578" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="360" y="180" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="360" y="180" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="373" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_window</text><text x="373" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">window · comm · buffer · size</text><text x="578" y="200" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">908</text><text x="578" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="360" y="250" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="360" y="250" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="373" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_dev_comm</text><text x="373" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">comm</text><text x="578" y="270" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">910</text><text x="578" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ART</text></g><g><rect x="360" y="336" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="360" y="336" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="373" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_group</text><text x="373" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">depth · edge</text><text x="578" y="356" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">906</text><text x="578" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><path d="M360 63 H320" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M360 133 H320" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M360 203 H320" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M360 273 H320" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M320 63 V273" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M320 153 H245" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="316" y="42" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">comm</text><text x="360" y="310" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">Group boundaries stand outside the communicator:</text><text x="360" y="324" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">N grouped sends are ONE launch, and nothing in a send row says so.</text><text x="10" y="215" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">Every temporal here is the HOST CALL, not</text><text x="10" y="229" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">the collective's execution — NCCL is stream-</text><text x="10" y="243" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">ordered, so these are enqueue facts.</text><text x="10" y="271" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">nccl_p2p is the only NCCL call that names a</text><text x="10" y="285" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">peer, and so the only one an exact edge</text><text x="10" y="299" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">follows from.</text><g><rect x="620" y="40" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="620" y="40" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="633" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_prof_comm</text><text x="633" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">nccl_comm_hash · nranks</text><text x="838" y="60" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">912</text><text x="838" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ART</text></g><g><rect x="620" y="130" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="620" y="130" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="633" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_coll_exec</text><text x="633" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">algo · proto · n_channels</text><text x="838" y="150" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">914</text><text x="838" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="620" y="220" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="620" y="220" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="633" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_proxy_op</text><text x="633" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">peer · channel · n_steps</text><text x="838" y="240" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">916</text><text x="838" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><path d="M236 143 H616" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="420" y="138" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">nccl_comm_hash</text><path d="M733 63 V126" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><path d="M733 153 V216" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="737" y="190" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">parent_event_id</text><text x="620" y="262" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">What NCCL DECIDED, not what was asked. The</text><text x="620" y="276" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">temporal here is the collective's own lifetime,</text><text x="620" y="290" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">NOT the enqueue on the left.</text><text x="620" y="312" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">parent_event_id is NCCL's OWN linkage handed</text><text x="620" y="326" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">back to us — not reconstructed from timing.</text><text x="620" y="348" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">No proxy op exists for device-initiated or</text><text x="620" y="362" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">NVLink traffic: it never reaches the CPU proxy.</text></svg>
