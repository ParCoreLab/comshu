y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="360" y="110" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="360" y="110" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="373" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_p2p</text><text x="373" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">comm · peer · dir · count</text><text x="578" y="130" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">904</text><text x="578" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><g><rect x="360" y="180" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="360" y="180" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="373" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_window</text><text x="373" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">window · comm · buffer · size</text><text x="578" y="200" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">908</text><text x="578" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="360" y="250" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="360" y="250" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="373" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_dev_comm</text><text x="373" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">comm</text><text x="578" y="270" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">910</text><text x="578" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">ENT</text></g><g><rect x="360" y="336" width="230" height="46" rx="3" fill="#ffffff" stroke="#a04a58" stroke-width="1.4" /><rect x="360" y="336" width="3.5" height="46" rx="1.5" fill="#a04a58" /><text x="373" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#24343f">nccl_group</text><text x="373" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">depth · edge</text><text x="578" y="356" fill="#a04a58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" text-anchor="end">906</text><text x="578" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#95a4b0" text-anchor="end">EVT</text></g><path d="M360 63 H320" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M360 133 H320" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M360 203 H320" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M360 273 H320" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M320 63 V273" fill="none" stroke="#8298a8" stroke-width="1.2" /><path d="M320 153 H245" fill="none" stroke="#8298a8" stroke-width="1.2" marker-end="url(#ar)" /><text x="316" y="42" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#5f7183">comm</text><text x="360" y="310" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">Group boundaries stand outside the communicator:</text><text x="360" y="324" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">N grouped sends are ONE launch, and nothing in a send row says so.</text><text x="10" y="215" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">Every temporal here is the HOST CALL, not</text><text x="10" y="229" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">the collective's execution — NCCL is stream-</text><text x="10" y="243" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">ordered, so these are enqueue facts.</text><text x="10" y="271" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">nccl_p2p is the only NCCL call that names a</text><text x="10" y="285" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">peer, and so the only one an exact edge</text><text x="10" y="299" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7c8c9a">follows from.</text></svg>
